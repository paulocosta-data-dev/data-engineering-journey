services:
  postgres:
    image: postgres:18
    container_name: journey-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  ingestion:
    build:
      context: ../04-data-ingestion
      dockerfile: Dockerfile.uv
    image: journey-taxi-ingestion:uv
    profiles:
      - ingestion
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - --url
      - https://github.com/DataTalksClub/nyc-tlc-data/releases/download/yellow/yellow_tripdata_2021-01.csv.gz
      - --host
      - postgres
      - --port
      - "5432"
      - --user
      - ${POSTGRES_USER}
      - --db
      - ${POSTGRES_DB}
      - --table
      - yellow_taxi_data_compose

volumes:
  postgres_data:
    external: true
    name: journey_postgres_data